name: CI

# Chạy mỗi khi push lên bất kỳ nhánh nào và mỗi khi mở/cập nhật Pull Request.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Push mới lên cùng nhánh sẽ hủy lần chạy cũ đang dở.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests + coverage
        run: npm run coverage

      - name: Upload coverage report
        if: matrix.node == 24 && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
