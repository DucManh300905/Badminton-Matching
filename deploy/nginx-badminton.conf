# Nginx cho Badminton Matching. Hướng dẫn: docs/DEPLOY.md
# Cài: sudo cp deploy/nginx-badminton.conf /etc/nginx/sites-available/badminton
#      sudo ln -s /etc/nginx/sites-available/badminton /etc/nginx/sites-enabled/badminton
#      sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS do Cloudflare đảm nhận phía trước; Nginx chỉ nghe cổng 80 trong mạng nội bộ.

# IP thật của người dùng: Cloudflare gửi trong header CF-Connecting-IP.
# Không có header này (gọi thẳng trong mạng nội bộ) thì dùng IP kết nối.
map $http_cf_connecting_ip $bm_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # API nhận JSON tối đa 100 KB; ảnh đại diện / ảnh bìa tối đa 5 MB (backend tự kiểm tra lại)
    client_max_body_size 6m;

    # Giao diện web (bản build của frontend)
    root /var/www/badminton;
    index index.html;

    # Tin nhắn thời gian thực (WBS 4.13): WebSocket → backend. Đặt trước /api/ để khớp trước.
    # Backend chỉ nhận kết nối từ đúng địa chỉ web (CLIENT_URL) và đăng nhập bằng tin đầu tiên.
    location = /api/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $bm_client_ip;
        # Giữ kết nối khi không có tin (backend ping mỗi 30 giây)
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # API → backend Node (PM2) trên cùng máy.
    # X-Forwarded-For chỉ chứa IP người dùng → backend đặt TRUST_PROXY=1.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $bm_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # Ảnh người dùng tải lên (đã đổi sang WebP, tên ngẫu nhiên, không bao giờ ghi đè) → cache lâu.
    # Thư mục trùng UPLOAD_DIR trong backend/.env. Chỉ phục vụ file, không liệt kê thư mục.
    location /uploads/ {
        alias /var/lib/badminton/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # File JS / CSS có mã băm trong tên → lưu cache lâu
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # React Router: mọi đường dẫn khác trả về index.html (không cache để luôn lấy bản mới)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
